[package]
name        = "light-platform"
version     = "1.6.5"
edition     = "2021"
authors     = ["Bledar Gjata <gjata@legacy.al>"]
description = "ESS-MAI Light Platform — Koordinues Sovran + APUPK/SNB/MiniEvolver + 0-copy + Layer 2 (zero if/else)"

# ─────────────────────────────────────────────────────────────────────────────
# FEATURES
# Default = ZERO varësi rrjeti, ZERO AI, ZERO C — kompilon & ekzekuton offline.
# Lingua: pure-Rust SQ+EN full, e brendshme — pa asnjë crate gjuhësor të jashtëm.
#   c_kernel    → kompilon kernelët C (light_buss, shadow_gj_legacy, buss_legacy)
#   full        → runtime_mode + c_kernel
# ─────────────────────────────────────────────────────────────────────────────
[features]
# SINTEZË: runtime_mode = ekzekutim real i deklaruar qartë (default).
#   • runtime_mode (default) → rruga reale; pa kernel/bus → boot fail-closed.
#   • dev_simulation (eksplicit) → lejon no-op fallback VETËM për testim lokal.
#   • Të dyja s'duhet të jenë bashkë; runtime_mode ka përparësi në fail-closed.
# PROD:  cargo build --release --features c_kernel  (runtime_mode mbetet default)
# TEST:  cargo test --features dev_simulation
default        = ["runtime_mode"]
runtime_mode   = []
dev_simulation = []
c_kernel   = []
full       = ["runtime_mode", "c_kernel"]

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES
#   Bërthama (sha2, hmac, serde, tracing) — gjithmonë; pa rrjet në runtime.
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
# Kriptografi — KODUNIK / LGC seal
sha2               = "0.10"
shadow_contracts   = { path = "../shadow-contracts" }
hmac               = "0.12"

# Serializim — ess_manifest report
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[build-dependencies]
cc = "1"

