name: Reproducibility report
description: Report a build, test, extraction, reproduction, or independent falsification result for public POC 003–006 evidence.
title: "[Reproducibility]: "
labels:
  - "kind/reproducibility"
  - "status/needs-triage"
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing ESS-MAI. Report successful, failed, and inconclusive reproductions with the same level of detail. Name the exact bounded claim; an unsuccessful build alone does not falsify it. Do not include secrets, personal data, private source, or private workspace material.

  - type: dropdown
    id: capsule
    attributes:
      label: Public capsule
      options:
        - POC 003 — cold-start reachability
        - POC 004 — GCL LAW-0 continuity
        - POC 005 — FFI LAW-0 authority non-duplication
        - POC 006 — Living Negative Knowledge verified re-entry
        - Cross-POC or collection integrity
    validations:
      required: true

  - type: dropdown
    id: method
    attributes:
      label: Review method
      options:
        - Exact rerun of the documented procedure
        - Independent implementation or falsification attempt
        - Platform or toolchain variation
        - Artifact, hash, or extraction-integrity check
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit, tag, or artifact-manifest SHA-256
      placeholder: Exact identifier tested
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: Exact claim and decision criterion
      description: Cite the public file and section. State what observation would reproduce, contradict, or leave that bounded claim unresolved.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, rustc version, cargo version, dependency/network conditions, and any relevant environment differences.
      render: text
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Exact commands
      description: Include setup, verification, build, test, experiment, repetition count, and controls. Redact only secrets, never outcome-relevant arguments.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - PASS — result reproduced as documented
        - PARTIAL — some documented results reproduced
        - NOT REPRODUCED — documented result did not reproduce
        - FALSIFIED — repeatable evidence contradicts the exact bounded claim
        - INCONCLUSIVE — environment or method differences prevent a conclusion
    validations:
      required: true

  - type: textarea
    id: observation
    attributes:
      label: Observed output and smallest divergence
      description: Include relevant raw output, hashes, and repetition totals. Compare expected and observed results and distinguish observation from interpretation.
    validations:
      required: true

  - type: textarea
    id: relationship
    attributes:
      label: Independence or project relationship
      description: State any project role, evidence authorship, collaboration, non-public access, or material conflict. Write "none" only if none applies.
    validations:
      required: true

  - type: textarea
    id: advancement
    attributes:
      label: Architecture-preserving next experiment
      description: Optional. State the smallest test or connection that could clarify the result without expanding authority or relaxing a fail-closed gate.

  - type: checkboxes
    id: boundary
    attributes:
      label: Evidence boundary
      options:
        - label: I tested only publicly disclosed material and did not attach credentials, private source, or personal data.
          required: true
        - label: I have separated observed behavior from interpretation and future hypotheses.
          required: true
        - label: I identified the exact bounded claim; I understand that non-reproduction is not automatically falsification.
          required: true
